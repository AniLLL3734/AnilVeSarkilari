<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anıl'ın Müzik Çalar</title>
    <meta name="description" content="Anıl'ın kişisel müzik koleksiyonu - Profesyonel müzik çalar">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== CSS RESET & ROOT ===== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a2e;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-glass: rgba(255, 255, 255, 0.06);
            --bg-glass-hover: rgba(255, 255, 255, 0.1);
            --text-primary: #f0f0f5;
            --text-secondary: #8888a0;
            --text-muted: #555570;
            --accent: #7c3aed;
            --accent-light: #a78bfa;
            --accent-glow: rgba(124, 58, 237, 0.3);
            --accent-gradient: linear-gradient(135deg, #7c3aed, #ec4899);
            --success: #10b981;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.06);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html { 
            scroll-behavior: smooth; 
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .bg-ambient {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-ambient .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: orbFloat 20s ease-in-out infinite;
        }
        .bg-ambient .orb:nth-child(1) {
            width: 400px; height: 400px;
            background: #7c3aed;
            top: -100px; left: -100px;
            animation-delay: 0s;
        }
        .bg-ambient .orb:nth-child(2) {
            width: 350px; height: 350px;
            background: #ec4899;
            bottom: -80px; right: -80px;
            animation-delay: -7s;
            animation-duration: 25s;
        }
        .bg-ambient .orb:nth-child(3) {
            width: 300px; height: 300px;
            background: #06b6d4;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
            animation-duration: 30s;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.9); }
            75% { transform: translate(40px, 30px) scale(1.05); }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

        /* ===== LAYOUT ===== */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 16px;
            padding-bottom: calc(200px + var(--safe-bottom));
        }

        /* ===== HEADER ===== */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 0 12px;
            backdrop-filter: blur(20px) saturate(1.5);
            -webkit-backdrop-filter: blur(20px) saturate(1.5);
            background: rgba(10, 10, 15, 0.8);
            margin: 0 -16px;
            padding-left: 16px;
            padding-right: 16px;
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 40px; height: 40px;
            background: var(--accent-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .logo-text h1 {
            font-size: 18px;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .logo-text span {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }
        .header-btn {
            width: 40px; height: 40px;
            border-radius: 12px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
        }
        .header-btn:hover, .header-btn:active {
            background: var(--bg-glass-hover);
            color: var(--accent-light);
            transform: scale(1.05);
        }
        .header-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* ===== SEARCH BAR ===== */
        .search-container {
            position: relative;
        }
        .search-bar {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-bar::placeholder { color: var(--text-muted); }
        .search-bar:focus {
            border-color: var(--accent);
            background: var(--bg-glass-hover);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            pointer-events: none;
        }

        /* ===== STATS BAR ===== */
        .stats-bar {
            display: flex;
            gap: 8px;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .stat-chip {
            padding: 6px 14px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-chip .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        /* ===== DOWNLOAD ALL BUTTON ===== */
        .download-all-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .download-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }
        .download-all-btn:active { transform: translateY(0); }
        .download-all-btn.downloading {
            background: var(--bg-tertiary);
            cursor: not-allowed;
        }

        /* ===== SONG LIST ===== */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .song-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
        }
        .song-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--accent-gradient);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }
        .song-item:hover {
            background: var(--bg-glass);
            border-color: var(--border);
        }
        .song-item.active {
            background: var(--bg-glass-hover);
            border-color: rgba(124, 58, 237, 0.3);
        }
        .song-item.active::before {
            opacity: 0.05;
        }
        .song-item.playing .song-art-play {
            opacity: 1;
        }
        .song-art-wrapper {
            width: 48px; height: 48px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            background: var(--bg-tertiary);
        }
        .song-art-wrapper img {
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .song-art-play {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 18px;
        }
        .song-item:hover .song-art-play,
        .song-item.active .song-art-play { opacity: 1; }

        .song-info {
            flex: 1;
            min-width: 0;
            z-index: 1;
        }
        .song-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
            line-height: 1.3;
        }
        .song-item.active .song-title {
            color: var(--accent-light);
        }
        .song-artist {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .song-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 1;
        }
        .song-dl-btn {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
        }
        .song-dl-btn:hover, .song-dl-btn:active {
            background: var(--bg-glass);
            color: var(--accent-light);
        }
        .song-dl-btn.downloaded {
            color: var(--success);
        }
        .song-index {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            min-width: 24px;
            text-align: center;
            z-index: 1;
        }
        .song-item.active .song-index {
            color: var(--accent-light);
        }

        /* ===== EQUALIZER ANIMATION ===== */
        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 16px;
        }
        .equalizer .bar {
            width: 3px;
            background: var(--accent-light);
            border-radius: 2px;
            animation: eqBounce 0.8s ease-in-out infinite;
        }
        .equalizer .bar:nth-child(1) { height: 8px; animation-delay: 0s; }
        .equalizer .bar:nth-child(2) { height: 14px; animation-delay: 0.2s; }
        .equalizer .bar:nth-child(3) { height: 6px; animation-delay: 0.4s; }
        .equalizer .bar:nth-child(4) { height: 12px; animation-delay: 0.1s; }
        @keyframes eqBounce {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(1); }
        }

        /* ===== NOW PLAYING BAR (BOTTOM) ===== */
        .now-playing-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 200;
            background: rgba(18, 18, 26, 0.95);
            backdrop-filter: blur(30px) saturate(1.8);
            -webkit-backdrop-filter: blur(30px) saturate(1.8);
            border-top: 1px solid var(--border);
            padding-bottom: var(--safe-bottom);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .now-playing-bar.visible {
            transform: translateY(0);
        }

        /* Progress bar at top of now-playing */
        .np-progress-container {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            position: relative;
        }
        .np-progress-container:hover {
            height: 6px;
        }
        .np-progress-container:hover .np-progress-thumb {
            opacity: 1;
        }
        .np-progress-fill {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 0 2px 2px 0;
            width: 0%;
            transition: width 0.1s linear;
            position: relative;
        }
        .np-progress-thumb {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px; height: 12px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 8px var(--accent-glow);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .np-content {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px 16px 8px;
        }

        .np-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .np-art {
            width: 48px; height: 48px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--bg-tertiary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .np-art img {
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .np-info {
            flex: 1;
            min-width: 0;
        }
        .np-title {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .np-artist {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        .np-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .np-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border-radius: 50%;
            padding: 0;
        }
        .np-btn:active { transform: scale(0.9); }
        .np-btn-sm { width: 36px; height: 36px; font-size: 18px; }
        .np-btn-md { width: 40px; height: 40px; font-size: 22px; }
        .np-btn-play {
            width: 48px; height: 48px;
            background: var(--accent-gradient);
            border-radius: 50%;
            font-size: 22px;
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .np-btn-play:hover { box-shadow: 0 6px 25px var(--accent-glow); }

        .np-time-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
        }
        .np-time {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .np-extras {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding-top: 4px;
        }
        .np-extra-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }
        .np-extra-btn.active { color: var(--accent-light); }
        .np-extra-btn:hover { color: var(--text-primary); }

        /* ===== LOADING ===== */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            gap: 20px;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 3px solid var(--bg-tertiary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: calc(200px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 20px;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(20px);
            white-space: nowrap;
            box-shadow: var(--shadow);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== DOWNLOAD PROGRESS ===== */
        .dl-progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: var(--accent-gradient);
            z-index: 500;
            transition: width 0.3s;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 380px) {
            .app-container { padding: 0 12px; }
            .song-item { padding: 8px 8px; gap: 10px; }
            .song-art-wrapper { width: 42px; height: 42px; }
            .logo-text h1 { font-size: 16px; }
            .np-btn-play { width: 44px; height: 44px; }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-state p {
            font-size: 14px;
            line-height: 1.6;
        }

        /* ===== FADE-IN ANIMATION ===== */
        .fade-in {
            animation: fadeIn 0.4s ease forwards;
            opacity: 0;
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        .song-item.fade-in {
            transform: translateY(8px);
        }

        /* ===== CACHE INDICATOR ===== */
        .cache-indicator {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--success);
            flex-shrink: 0;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .cache-indicator.cached { opacity: 1; }
    </style>
</head>
<body>
    <!-- Ambient Background -->
    <div class="bg-ambient">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- Download Progress -->
    <div class="dl-progress-bar" id="dlProgressBar" style="width: 0%; display: none;"></div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Main Container -->
    <div class="app-container">
        <!-- Header -->
        <header class="app-header" id="appHeader">
            <div class="header-top">
                <div class="logo">
                    <div class="logo-icon">🎵</div>
                    <div class="logo-text">
                        <h1>Anıl'ın Müziği</h1>
                        <span>Kişisel Koleksiyon</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="header-btn" id="refreshBtn" title="Yenile" onclick="refreshSongs()">🔄</button>
                    <button class="header-btn" id="shuffleBtn" title="Karıştır" onclick="toggleShuffle()">🔀</button>
                    <button class="header-btn" id="repeatBtn" title="Tekrarla" onclick="toggleRepeat()">🔁</button>
                </div>
            </div>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="search" class="search-bar" id="searchBar" placeholder="Şarkı ara..." autocomplete="off">
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-chip"><span class="dot"></span><span id="songCount">Yükleniyor...</span></div>
            <div class="stat-chip"><span class="dot" style="background: var(--success)"></span><span id="cacheStatus">Önbellek: --</span></div>
        </div>

        <!-- Download All -->
        <button class="download-all-btn" id="downloadAllBtn" onclick="downloadAllSongs()">
            <span>⬇️</span>
            <span>Tüm Şarkıları İndir</span>
        </button>

        <!-- Song List -->
        <div id="songListContainer">
            <div class="loading-container">
                <div class="spinner"></div>
                <div class="loading-text">Şarkılar yükleniyor...</div>
            </div>
        </div>
    </div>

    <!-- Now Playing Bar -->
    <div class="now-playing-bar" id="nowPlayingBar">
        <div class="np-progress-container" id="progressContainer">
            <div class="np-progress-fill" id="progressFill">
                <div class="np-progress-thumb"></div>
            </div>
        </div>
        <div class="np-content">
            <div class="np-top">
                <div class="np-art" id="npArt">
                    <img src="" alt="" id="npArtImg">
                </div>
                <div class="np-info">
                    <div class="np-title" id="npTitle">---</div>
                    <div class="np-artist" id="npArtist">---</div>
                </div>
                <div class="np-controls">
                    <button class="np-btn np-btn-sm" onclick="prevSong()" title="Önceki">⏮️</button>
                    <button class="np-btn np-btn-play" id="playPauseBtn" onclick="togglePlay()" title="Oynat/Duraklat">▶️</button>
                    <button class="np-btn np-btn-sm" onclick="nextSong()" title="Sonraki">⏭️</button>
                </div>
            </div>
            <div class="np-time-row">
                <span class="np-time" id="currentTime">0:00</span>
                <div class="np-extras">
                    <button class="np-extra-btn" id="npShuffleBtn" onclick="toggleShuffle()" title="Karıştır">🔀</button>
                    <button class="np-extra-btn" id="npRepeatBtn" onclick="toggleRepeat()" title="Tekrarla">🔁</button>
                </div>
                <span class="np-time" id="duration">0:00</span>
            </div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" preload="auto"></audio>

    <script>
        // ===== CONFIGURATION =====
        const REPO_OWNER = 'AniLLL3734';
        const REPO_NAME = 'AnilVeSarkilari';
        const BRANCH = 'main';
        const BASE_RAW_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/`;
        const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
        const CACHE_NAME = 'anil-muzik-cache-v2';
        const FILE_LIST_CACHE_KEY = 'anil-file-list';
        const FILE_LIST_CACHE_TTL = 30 * 60 * 1000; // 30 minutes

        // ===== STATE =====
        let songs = [];
        let filteredSongs = [];
        let currentIndex = -1;
        let isPlaying = false;
        let isShuffle = false;
        let repeatMode = 0; // 0: off, 1: all, 2: one
        let shuffleQueue = [];
        let shuffleIndex = -1;
        let imageFiles = {};
        let defaultArtUrl = '';
        let downloadingAll = false;

        // ===== DOM ELEMENTS =====
        const audio = document.getElementById('audioPlayer');
        const songListContainer = document.getElementById('songListContainer');
        const searchBar = document.getElementById('searchBar');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressFill = document.getElementById('progressFill');
        const progressContainer = document.getElementById('progressContainer');
        const npTitle = document.getElementById('npTitle');
        const npArtist = document.getElementById('npArtist');
        const npArtImg = document.getElementById('npArtImg');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const nowPlayingBar = document.getElementById('nowPlayingBar');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const npShuffleBtn = document.getElementById('npShuffleBtn');
        const npRepeatBtn = document.getElementById('npRepeatBtn');
        const toastEl = document.getElementById('toast');
        const dlProgressBar = document.getElementById('dlProgressBar');

        // ===== INITIALIZATION =====
        init();

        async function init() {
            await loadFileList();
            renderSongList(songs);
            setupEventListeners();
            updateCacheStatus();
        }

        // ===== FILE LIST LOADING (with localStorage cache) =====
        async function loadFileList(forceRefresh = false) {
            // Check local cache first
            if (!forceRefresh) {
                const cached = localStorage.getItem(FILE_LIST_CACHE_KEY);
                if (cached) {
                    try {
                        const parsed = JSON.parse(cached);
                        if (Date.now() - parsed.timestamp < FILE_LIST_CACHE_TTL) {
                            processFetchedFiles(parsed.data);
                            return;
                        }
                    } catch (e) { /* ignore parse errors */ }
                }
            }

            try {
                const fetchUrl = forceRefresh ? `${API_URL}?t=${Date.now()}` : API_URL;
                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error('API error');
                const data = await response.json();
                
                // Cache the file list
                localStorage.setItem(FILE_LIST_CACHE_KEY, JSON.stringify({
                    timestamp: Date.now(),
                    data: data
                }));
                
                processFetchedFiles(data);
            } catch (error) {
                console.error('Error fetching file list:', error);
                songListContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">😕</div>
                        <p>Şarkılar yüklenemedi.<br>Lütfen sayfayı yenileyin.</p>
                    </div>
                `;
            }
        }

        async function refreshSongs() {
            const btn = document.getElementById('refreshBtn');
            if (btn) btn.classList.add('active');
            
            songListContainer.innerHTML = `
                <div class="loading-container">
                    <div class="spinner"></div>
                    <div class="loading-text">Şarkılar güncelleniyor...</div>
                </div>
            `;
            
            await loadFileList(true);
            
            const query = searchBar.value.toLowerCase().trim();
            if (query) {
                filteredSongs = songs.filter(s => 
                    s.title.toLowerCase().includes(query) || 
                    s.artist.toLowerCase().includes(query) ||
                    s.filename.toLowerCase().includes(query)
                );
            } else {
                filteredSongs = [...songs];
            }
            
            renderSongList(filteredSongs);
            updateCacheStatus();
            
            if (btn) btn.classList.remove('active');
            showToast('✅ Liste güncellendi!');
        }

        function processFetchedFiles(data) {
            const mp3Files = [];
            const images = {};

            data.forEach(file => {
                const name = file.name;
                if (name.toLowerCase().endsWith('.mp3')) {
                    mp3Files.push(name);
                } else if (/\.(jpg|jpeg|png|webp)$/i.test(name)) {
                    images[name.toLowerCase()] = name;
                }
            });

            imageFiles = images;

            // Find default art (AlbumArt Large)
            const defaultArtKeys = Object.keys(images).filter(k => k.includes('large'));
            if (defaultArtKeys.length > 0) {
                defaultArtUrl = BASE_RAW_URL + encodeFileURI(images[defaultArtKeys[0]]);
            }

            // Parse songs
            songs = mp3Files.map((filename, idx) => {
                const parsed = parseSongName(filename);
                return {
                    id: idx,
                    filename: filename,
                    title: parsed.title,
                    artist: parsed.artist,
                    url: BASE_RAW_URL + encodeFileURI(filename),
                    artUrl: findArtForSong(filename)
                };
            });

            filteredSongs = [...songs];
            document.getElementById('songCount').textContent = `${songs.length} şarkı`;
        }

        function encodeFileURI(filename) {
            return filename.split('/').map(part => encodeURIComponent(part)).join('/');
        }

        function parseSongName(filename) {
            let name = filename.replace(/\.mp3$/i, '');
            
            // Remove common patterns like [MP3], (Official Video), etc.
            name = name.replace(/\s*\[.*?\]\s*/g, ' ');
            name = name.replace(/\s*\(Official\s*(Video|Audio)\)\s*/gi, ' ');
            
            // Remove leading number pattern like "01. " or "20170517 - "
            name = name.replace(/^\d{1,3}\.\s*/, '');
            
            // Try to split by " - "
            let title = name.trim();
            let artist = '';
            
            const dashIdx = name.indexOf(' - ');
            if (dashIdx > 0) {
                const parts = name.split(' - ');
                if (parts.length >= 2) {
                    artist = parts[0].trim();
                    title = parts.slice(1).join(' - ').trim();
                }
            }
            
            return { title, artist: artist || 'Bilinmeyen Sanatçı' };
        }

        function findArtForSong(filename) {
            const baseName = filename.replace(/\.mp3$/i, '');
            // Try to find a matching image
            const possibleExts = ['.webp', '.jpg', '.jpeg', '.png'];
            for (const ext of possibleExts) {
                const key = (baseName + ext).toLowerCase();
                if (imageFiles[key]) {
                    return BASE_RAW_URL + encodeFileURI(imageFiles[key]);
                }
            }
            return defaultArtUrl || '';
        }

        // ===== RENDER SONG LIST =====
        function renderSongList(list) {
            if (list.length === 0) {
                songListContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎵</div>
                        <p>Sonuç bulunamadı</p>
                    </div>
                `;
                return;
            }

            const fragment = document.createDocumentFragment();
            const songListDiv = document.createElement('div');
            songListDiv.className = 'song-list';

            list.forEach((song, idx) => {
                const div = document.createElement('div');
                div.className = `song-item fade-in${currentIndex === song.id ? ' active' : ''}${currentIndex === song.id && isPlaying ? ' playing' : ''}`;
                div.style.animationDelay = `${Math.min(idx * 0.03, 0.6)}s`;
                div.dataset.songId = song.id;
                div.onclick = () => playSong(song.id);

                div.innerHTML = `
                    <span class="song-index">${currentIndex === song.id && isPlaying 
                        ? '<div class="equalizer"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>' 
                        : (idx + 1)}</span>
                    <div class="song-art-wrapper">
                        <img src="${song.artUrl || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDgiIGhlaWdodD0iNDgiIHZpZXdCb3g9IjAgMCA0OCA0OCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDgiIGhlaWdodD0iNDgiIGZpbGw9IiMxYTFhMmUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIyMCIgZmlsbD0iIzU1NTU3MCI+8J+OtTwvdGV4dD48L3N2Zz4='}" 
                             alt="${song.title}" loading="lazy" 
                             onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDgiIGhlaWdodD0iNDgiIHZpZXdCb3g9IjAgMCA0OCA0OCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDgiIGhlaWdodD0iNDgiIGZpbGw9IiMxYTFhMmUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIyMCIgZmlsbD0iIzU1NTU3MCI+8J+OtTwvdGV4dD48L3N2Zz4='">
                        <div class="song-art-play">${currentIndex === song.id && isPlaying ? '⏸️' : '▶️'}</div>
                    </div>
                    <div class="song-info">
                        <div class="song-title">${escapeHTML(song.title)}</div>
                        <div class="song-artist">${escapeHTML(song.artist)}</div>
                    </div>
                    <div class="cache-indicator" id="cache-${song.id}"></div>
                    <div class="song-actions">
                        <button class="song-dl-btn" onclick="event.stopPropagation(); downloadSong(${song.id})" title="İndir">⬇️</button>
                    </div>
                `;

                songListDiv.appendChild(div);
            });

            songListContainer.innerHTML = '';
            songListContainer.appendChild(songListDiv);

            // Check cache status for each song
            checkCacheForSongs();
        }

        // ===== PLAY SONG =====
        function playSong(songId) {
            const song = songs.find(s => s.id === songId);
            if (!song) return;

            currentIndex = songId;

            // Try to load from cache first
            loadAudioFromCacheOrNetwork(song.url);
            
            npTitle.textContent = song.title;
            npArtist.textContent = song.artist;
            npArtImg.src = song.artUrl || '';
            npArtImg.onerror = function() { this.style.display = 'none'; };
            npArtImg.onload = function() { this.style.display = 'block'; };

            nowPlayingBar.classList.add('visible');
            updateMediaSession(song);
            updateActiveSong();
        }

        async function loadAudioFromCacheOrNetwork(url) {
            try {
                const cache = await caches.open(CACHE_NAME);
                const cachedResponse = await cache.match(url);
                
                if (cachedResponse) {
                    const blob = await cachedResponse.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    audio.src = blobUrl;
                    audio.play().catch(e => console.log('Play failed:', e));
                    isPlaying = true;
                    updatePlayButton();
                    return;
                }
            } catch (e) {
                // Cache API not available, fall through to network
            }

            audio.src = url;
            audio.play().catch(e => console.log('Play failed:', e));
            isPlaying = true;
            updatePlayButton();

            // Cache in background
            cacheAudioInBackground(url);
        }

        async function cacheAudioInBackground(url) {
            try {
                const cache = await caches.open(CACHE_NAME);
                const exists = await cache.match(url);
                if (!exists) {
                    await cache.add(url);
                    updateCacheStatus();
                    checkCacheForSongs();
                }
            } catch (e) {
                // Caching failed, that's okay
            }
        }

        // ===== CONTROLS =====
        function togglePlay() {
            if (currentIndex === -1 && songs.length > 0) {
                playSong(songs[0].id);
                return;
            }
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                audio.play().catch(e => {});
                isPlaying = true;
            }
            updatePlayButton();
            updateActiveSong();
        }

        function nextSong() {
            if (songs.length === 0) return;

            if (isShuffle) {
                playRandomSong();
                return;
            }

            const currentListIndex = filteredSongs.findIndex(s => s.id === currentIndex);
            let nextIdx;
            if (currentListIndex >= 0 && currentListIndex < filteredSongs.length - 1) {
                nextIdx = filteredSongs[currentListIndex + 1].id;
            } else {
                nextIdx = filteredSongs[0].id;
            }
            playSong(nextIdx);
        }

        function prevSong() {
            if (songs.length === 0) return;

            // If more than 3 seconds in, restart the song
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }

            if (isShuffle) {
                playRandomSong();
                return;
            }

            const currentListIndex = filteredSongs.findIndex(s => s.id === currentIndex);
            let prevIdx;
            if (currentListIndex > 0) {
                prevIdx = filteredSongs[currentListIndex - 1].id;
            } else {
                prevIdx = filteredSongs[filteredSongs.length - 1].id;
            }
            playSong(prevIdx);
        }

        function playRandomSong() {
            if (filteredSongs.length <= 1) {
                if (filteredSongs.length === 1) playSong(filteredSongs[0].id);
                return;
            }
            let randomIdx;
            do {
                randomIdx = Math.floor(Math.random() * filteredSongs.length);
            } while (filteredSongs[randomIdx].id === currentIndex);
            playSong(filteredSongs[randomIdx].id);
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
            npShuffleBtn.classList.toggle('active', isShuffle);
            showToast(isShuffle ? '🔀 Karıştırma açık' : '🔀 Karıştırma kapalı');
        }

        function toggleRepeat() {
            repeatMode = (repeatMode + 1) % 3;
            const labels = ['🔁 Tekrar kapalı', '🔁 Tümünü tekrarla', '🔂 Birini tekrarla'];
            const icons = ['🔁', '🔁', '🔂'];
            repeatBtn.textContent = icons[repeatMode];
            npRepeatBtn.textContent = icons[repeatMode];
            repeatBtn.classList.toggle('active', repeatMode > 0);
            npRepeatBtn.classList.toggle('active', repeatMode > 0);
            showToast(labels[repeatMode]);
        }

        function updatePlayButton() {
            playPauseBtn.textContent = isPlaying ? '⏸️' : '▶️';
        }

        function updateActiveSong() {
            renderSongList(filteredSongs);
        }

        // ===== PROGRESS & TIME =====
        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // ===== SEARCH =====
        searchBar.addEventListener('input', () => {
            const query = searchBar.value.toLowerCase().trim();
            if (!query) {
                filteredSongs = [...songs];
            } else {
                filteredSongs = songs.filter(s => 
                    s.title.toLowerCase().includes(query) || 
                    s.artist.toLowerCase().includes(query) ||
                    s.filename.toLowerCase().includes(query)
                );
            }
            renderSongList(filteredSongs);
        });

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    const pct = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = pct + '%';
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                    durationEl.textContent = formatTime(audio.duration);
                }
            });

            audio.addEventListener('ended', () => {
                if (repeatMode === 2) {
                    audio.currentTime = 0;
                    audio.play();
                    return;
                }
                if (isShuffle) {
                    playRandomSong();
                } else {
                    const currentListIndex = filteredSongs.findIndex(s => s.id === currentIndex);
                    if (currentListIndex < filteredSongs.length - 1) {
                        nextSong();
                    } else if (repeatMode === 1) {
                        playSong(filteredSongs[0].id);
                    } else {
                        isPlaying = false;
                        updatePlayButton();
                        updateActiveSong();
                    }
                }
            });

            audio.addEventListener('play', () => {
                isPlaying = true;
                updatePlayButton();
                updateActiveSong();
            });

            audio.addEventListener('pause', () => {
                isPlaying = false;
                updatePlayButton();
                updateActiveSong();
            });

            // Progress bar seeking
            let isSeeking = false;
            progressContainer.addEventListener('mousedown', startSeek);
            progressContainer.addEventListener('touchstart', startSeek, { passive: true });

            function startSeek(e) {
                isSeeking = true;
                seek(e);
                document.addEventListener('mousemove', seek);
                document.addEventListener('mouseup', endSeek);
                document.addEventListener('touchmove', seek, { passive: true });
                document.addEventListener('touchend', endSeek);
            }

            function seek(e) {
                if (!isSeeking) return;
                const rect = progressContainer.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                if (audio.duration) {
                    audio.currentTime = pct * audio.duration;
                    progressFill.style.width = (pct * 100) + '%';
                }
            }

            function endSeek() {
                isSeeking = false;
                document.removeEventListener('mousemove', seek);
                document.removeEventListener('mouseup', endSeek);
                document.removeEventListener('touchmove', seek);
                document.removeEventListener('touchend', endSeek);
            }

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                switch (e.code) {
                    case 'Space': e.preventDefault(); togglePlay(); break;
                    case 'ArrowRight': nextSong(); break;
                    case 'ArrowLeft': prevSong(); break;
                }
            });
        }

        // ===== MEDIA SESSION API (Phone Notification Controls) =====
        function updateMediaSession(song) {
            if (!('mediaSession' in navigator)) return;

            const artwork = [];
            if (song.artUrl) {
                artwork.push({ src: song.artUrl, sizes: '512x512', type: 'image/jpeg' });
            }

            navigator.mediaSession.metadata = new MediaMetadata({
                title: song.title,
                artist: song.artist,
                album: "Anıl'ın Müziği",
                artwork: artwork
            });

            navigator.mediaSession.setActionHandler('play', () => {
                audio.play();
                isPlaying = true;
                updatePlayButton();
            });
            navigator.mediaSession.setActionHandler('pause', () => {
                audio.pause();
                isPlaying = false;
                updatePlayButton();
            });
            navigator.mediaSession.setActionHandler('previoustrack', prevSong);
            navigator.mediaSession.setActionHandler('nexttrack', nextSong);
            navigator.mediaSession.setActionHandler('seekbackward', (details) => {
                audio.currentTime = Math.max(0, audio.currentTime - (details.seekOffset || 10));
            });
            navigator.mediaSession.setActionHandler('seekforward', (details) => {
                audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (details.seekOffset || 10));
            });
            navigator.mediaSession.setActionHandler('seekto', (details) => {
                if (details.fastSeek && 'fastSeek' in audio) {
                    audio.fastSeek(details.seekTime);
                } else {
                    audio.currentTime = details.seekTime;
                }
            });
        }

        // ===== DOWNLOAD FUNCTIONS =====
        async function downloadSong(songId) {
            const song = songs.find(s => s.id === songId);
            if (!song) return;

            showToast(`⬇️ İndiriliyor: ${song.title}`);

            try {
                const response = await fetch(song.url);
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = song.filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast(`✅ İndirildi: ${song.title}`);

                // Cache it too
                try {
                    const cache = await caches.open(CACHE_NAME);
                    await cache.put(song.url, new Response(blob.slice()));
                    updateCacheStatus();
                    checkCacheForSongs();
                } catch (e) {}
            } catch (error) {
                showToast(`❌ İndirme başarısız: ${song.title}`);
            }
        }

        async function downloadAllSongs() {
            if (downloadingAll) return;
            downloadingAll = true;
            const btn = document.getElementById('downloadAllBtn');
            btn.classList.add('downloading');
            btn.innerHTML = '<span>⏳</span><span>İndiriliyor... 0/' + songs.length + '</span>';
            
            dlProgressBar.style.display = 'block';

            for (let i = 0; i < songs.length; i++) {
                const song = songs[i];
                try {
                    btn.innerHTML = `<span>⬇️</span><span>İndiriliyor... ${i + 1}/${songs.length}</span>`;
                    dlProgressBar.style.width = ((i + 1) / songs.length * 100) + '%';

                    const response = await fetch(song.url);
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = song.filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    // Cache it
                    try {
                        const cache = await caches.open(CACHE_NAME);
                        await cache.put(song.url, new Response(blob.slice()));
                    } catch (e) {}

                    // Small delay to prevent browser from blocking rapid downloads
                    await new Promise(r => setTimeout(r, 800));
                } catch (error) {
                    console.error(`Download failed: ${song.filename}`, error);
                }
            }

            downloadingAll = false;
            btn.classList.remove('downloading');
            btn.innerHTML = '<span>⬇️</span><span>Tüm Şarkıları İndir</span>';
            dlProgressBar.style.display = 'none';
            dlProgressBar.style.width = '0%';
            showToast('✅ Tüm indirmeler tamamlandı!');
            updateCacheStatus();
            checkCacheForSongs();
        }

        // ===== CACHE MANAGEMENT =====
        async function updateCacheStatus() {
            try {
                const cache = await caches.open(CACHE_NAME);
                const keys = await cache.keys();
                const mp3Keys = keys.filter(k => k.url.endsWith('.mp3'));
                document.getElementById('cacheStatus').textContent = `Önbellek: ${mp3Keys.length} şarkı`;
            } catch (e) {
                document.getElementById('cacheStatus').textContent = 'Önbellek: --';
            }
        }

        async function checkCacheForSongs() {
            try {
                const cache = await caches.open(CACHE_NAME);
                for (const song of songs) {
                    const cached = await cache.match(song.url);
                    const indicator = document.getElementById(`cache-${song.id}`);
                    if (indicator) {
                        indicator.classList.toggle('cached', !!cached);
                    }
                }
            } catch (e) {}
        }

        // ===== UTILITY FUNCTIONS =====
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        let toastTimeout;
        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.classList.remove('show');
            }, 2500);
        }

        // ===== SERVICE WORKER REGISTRATION =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {
                // Service worker registration failed, but app will still work
            });
        }
    </script>
</body>
</html>
