<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anıl'ın Müzik Çaları - SptfyJam Player</title>
    <meta name="description" content="Anıl'ın kişisel müzik koleksiyonu - SptfyJam Müzik Çalar">
    <meta name="theme-color" content="#0a0a0c">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    
    <!-- Google Fonts & Lucide Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-card: rgba(22, 22, 29, 0.75);
            --bg-card-hover: rgba(32, 32, 42, 0.85);
            --accent-green: #1db954;
            --accent-green-glow: rgba(29, 185, 84, 0.35);
            --accent-gradient: linear-gradient(135deg, #1db954 0%, #1ed760 50%, #4facfe 100%);
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            --border-light: rgba(255, 255, 255, 0.08);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 8px;
            --shadow-glow: 0 10px 30px -10px rgba(29, 185, 84, 0.3);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(29, 185, 84, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(142, 45, 226, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            overflow-x: hidden;
            padding-bottom: calc(130px + var(--safe-bottom));
        }

        /* App Container */
        .app-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            margin-bottom: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: var(--accent-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: var(--shadow-glow);
        }

        .logo h1 {
            font-size: 1.3rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .logo span {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: block;
        }

        /* Section Card */
        .section-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .song-count-badge {
            font-size: 0.8rem;
            padding: 4px 12px;
            background: rgba(29, 185, 84, 0.15);
            color: var(--accent-green);
            border-radius: 20px;
            font-weight: 700;
        }

        /* Search & Controls */
        .controls-row {
            display: flex;
            gap: 10px;
        }

        .search-bar {
            position: relative;
            flex: 1;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent-green);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 12px var(--accent-green-glow);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .btn-ctrl {
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-ctrl:hover, .btn-ctrl.active {
            background: rgba(29, 185, 84, 0.2);
            color: var(--accent-green);
            border-color: rgba(29, 185, 84, 0.4);
        }

        /* Download All Button */
        .download-all-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-gradient);
            border: none;
            border-radius: var(--radius-md);
            color: black;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow-glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .download-all-btn:hover {
            transform: translateY(-2px);
        }

        /* Song List */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .song-list::-webkit-scrollbar {
            width: 5px;
        }
        .song-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .song-item:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-light);
            transform: translateX(4px);
        }

        .song-item.active {
            background: rgba(29, 185, 84, 0.14);
            border-color: rgba(29, 185, 84, 0.35);
        }

        .song-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .song-disc {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-green);
            flex-shrink: 0;
            font-size: 18px;
        }

        .song-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .song-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-item.active .song-title {
            color: var(--accent-green);
        }

        .song-artist {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            color: white;
        }

        /* Floating Bottom Player */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(12, 12, 16, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--border-light);
            padding: 12px 20px calc(12px + var(--safe-bottom));
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-content {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .player-track-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            flex: 1;
        }

        .player-cover {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-size: 20px;
            flex-shrink: 0;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-play-lg {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: white;
            color: black;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: transform 0.2s ease;
        }

        .btn-play-lg:hover {
            transform: scale(1.08);
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.4);
        }

        .progress-container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .progress-bar {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-green);
            border-radius: 10px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .spin {
            animation: spin 3s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🎵</div>
                <div>
                    <h1>Anıl'ın Müzikleri</h1>
                    <span>SptfyJam Player</span>
                </div>
            </div>
            <button class="btn-ctrl" id="downloadAllTopBtn" onclick="downloadAllSongs()">
                ⬇️ İndir
            </button>
        </header>

        <!-- Main Music Section -->
        <main className="section-card">
            <div className="section-card">
                <div className="section-title">
                    <span>Müzik Koleksiyonu</span>
                    <span className="song-count-badge" id="songCountBadge">Yükleniyor...</span>
                </div>

                <div className="controls-row">
                    <div className="search-bar">
                        <span className="search-icon">🔍</span>
                        <input 
                            type="text" 
                            className="search-input" 
                            id="searchInput" 
                            placeholder="Şarkı veya sanatçı ara..."
                            oninput="filterSongs()"
                        >
                    </div>
                    <button className="btn-ctrl" id="shuffleToggleBtn" onclick="toggleShuffle()">
                        🔀 Shuffle
                    </button>
                </div>

                <button className="download-all-btn" id="downloadAllBtn" onclick="downloadAllSongs()">
                    ⬇️ Tüm Şarkıları Cihaza İndir
                </button>

                <div className="song-list" id="songList">
                    <p style="color: var(--text-muted); text-align: center; padding: 30px;">Şarkılar yükleniyor...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Hidden HTML5 Audio -->
    <audio id="audioPlayer"></audio>

    <!-- Floating Bottom Player Bar -->
    <div class="player-bar" id="playerBar" style="display: none;">
        <div class="player-content">
            <div class="player-track-info">
                <div class="player-cover">🎵</div>
                <div class="song-details">
                    <span class="song-title" id="playerTitle">Şarkı Seçilmedi</span>
                    <span class="song-artist" id="playerArtist">Anıl'ın Müzikleri</span>
                </div>
            </div>

            <div class="player-controls">
                <button class="btn-icon" onclick="playPrevTrack()">⏮️</button>
                <button class="btn-play-lg" id="playPauseBtn" onclick="togglePlayPause()">▶️</button>
                <button class="btn-icon" onclick="playNextTrack()">⏭️</button>
            </div>
        </div>

        <div class="progress-container">
            <span id="currentTimeTxt">0:00</span>
            <div class="progress-bar" id="progressBar" onclick="seekAudio(event)">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span id="durationTxt">0:00</span>
        </div>
    </div>

        // Initialize application after DOM load
        window.addEventListener('DOMContentLoaded', () => {
            initPlayer();
        });

        async function initPlayer() {
            let files = LOCAL_FILES;
            
            // Try fetching songs_db.json if LOCAL_FILES is empty
            if (!files || files.length === 0) {
                try {
                    const res = await fetch('songs_db.json');
                    const dbData = await res.json();
                    files = dbData.map(item => ({ name: item.filename || item.name }));
                } catch (e) {
                    console.warn("Could not load songs_db.json:", e);
                }
            }

            // Parse MP3 files
            songsList = files
                .filter(f => f.name && f.name.toLowerCase().endsWith('.mp3'))
                .map((f, index) => {
                    const nameWithoutExt = f.name.replace(/\.[^/.]+$/, "");
                    let artist = "Anıl'ın Müzikleri";
                    let title = nameWithoutExt;

                    if (nameWithoutExt.includes(" - ")) {
                        const parts = nameWithoutExt.split(" - ");
                        artist = parts[0].trim();
                        title = parts.slice(1).join(" - ").trim();
                    } else if (nameWithoutExt.includes(" & ")) {
                        const parts = nameWithoutExt.split(" & ");
                        artist = parts[0].trim();
                        title = parts.slice(1).join(" & ").trim();
                    }

                    return {
                        id: index,
                        fileName: f.name,
                        title: title,
                        artist: artist,
                        url: encodeURIComponent(f.name)
                    };
                });

            filteredSongs = [...songsList];
            songCountBadge.textContent = `${songsList.length} Şarkı`;
            renderSongs();
            setupAudioListeners();
        }

        function renderSongs() {
            if (filteredSongs.length === 0) {
                songListEl.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 30px;">Şarkı bulunamadı.</p>`;
                return;
            }

            songListEl.innerHTML = filteredSongs.map((song) => {
                const globalIdx = songsList.findIndex(s => s.id === song.id);
                const isCurrent = currentIndex === globalIdx;

                return `
                    <div class="song-item ${isCurrent ? 'active' : ''}" onclick="playSong(${globalIdx})">
                        <div class="song-info">
                            <div class="song-disc">
                                ${isCurrent && isPlaying ? '💿' : '🎵'}
                            </div>
                            <div class="song-details">
                                <span class="song-title">${escapeHtml(song.title)}</span>
                                <span class="song-artist">${escapeHtml(song.artist)}</span>
                            </div>
                        </div>
                        <div class="song-actions">
                            <button class="btn-icon" onclick="event.stopPropagation(); downloadSong('${escapeHtml(song.fileName)}')" title="İndir">⬇️</button>
                            <button class="btn-icon">${isCurrent && isPlaying ? '⏸️' : '▶️'}</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterSongs() {
            const q = searchInput.value.toLowerCase().trim();
            if (!q) {
                filteredSongs = [...songsList];
            } else {
                filteredSongs = songsList.filter(s => 
                    s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)
                );
            }
            renderSongs();
        }

        function playSong(index) {
            if (index < 0 || index >= songsList.length) return;
            currentIndex = index;
            const song = songsList[index];

            audio.src = song.url;
            audio.play().then(() => {
                isPlaying = true;
                updatePlayerUI();
            }).catch(console.error);

            // MediaSession for Mobile Background Playback & Lockscreen
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    album: "Anıl'ın Müzik Çaları",
                    artwork: [
                        { src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🎵</text></svg>', sizes: '512x512', type: 'image/svg+xml' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', () => { audio.play(); isPlaying = true; updatePlayerUI(); });
                navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); isPlaying = false; updatePlayerUI(); });
                navigator.mediaSession.setActionHandler('previoustrack', playPrevTrack);
                navigator.mediaSession.setActionHandler('nexttrack', playNextTrack);
            }
        }

        function togglePlayPause() {
            if (currentIndex === null && songsList.length > 0) {
                playSong(0);
                return;
            }
            if (!audio.src) return;

            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                audio.play().catch(console.error);
                isPlaying = true;
            }
            updatePlayerUI();
        }

        function playNextTrack() {
            if (songsList.length === 0) return;
            if (isShuffle) {
                const randomIdx = Math.floor(Math.random() * songsList.length);
                playSong(randomIdx);
            } else {
                const nextIdx = (currentIndex === null || currentIndex >= songsList.length - 1) ? 0 : currentIndex + 1;
                playSong(nextIdx);
            }
        }

        function playPrevTrack() {
            if (songsList.length === 0) return;
            const prevIdx = (currentIndex === null || currentIndex <= 0) ? songsList.length - 1 : currentIndex - 1;
            playSong(prevIdx);
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            shuffleToggleBtn.style.color = isShuffle ? 'var(--accent-green)' : 'var(--text-muted)';
            shuffleToggleBtn.style.borderColor = isShuffle ? 'rgba(29, 185, 84, 0.4)' : 'var(--border-light)';
        }

        function updatePlayerUI() {
            if (currentIndex !== null && songsList[currentIndex]) {
                const song = songsList[currentIndex];
                playerTitle.textContent = song.title;
                playerArtist.textContent = song.artist;
                playPauseBtn.textContent = isPlaying ? '⏸️' : '▶️';
                playerBar.style.display = 'flex';
                renderSongs();
            }
        }

        function setupAudioListeners() {
            audio.addEventListener('timeupdate', () => {
                if (!audio.duration) return;
                const pct = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${pct}%`;
                currentTimeTxt.textContent = formatTime(audio.currentTime);
                durationTxt.textContent = formatTime(audio.duration);
            });

            audio.addEventListener('ended', () => {
                playNextTrack();
            });
        }

        function seekAudio(e) {
            if (!audio.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const newTime = (clickX / rect.width) * audio.duration;
            audio.currentTime = newTime;
        }

        function downloadSong(fileName) {
            const a = document.createElement('a');
            a.href = fileName;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function downloadAllSongs() {
            if (!confirm(`Toplam ${songsList.length} şarkı indirilmek üzere sıraya alınacak. Devam etmek istiyor musunuz?`)) return;
            songsList.forEach((song, i) => {
                setTimeout(() => downloadSong(song.fileName), i * 300);
            });
        }

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
